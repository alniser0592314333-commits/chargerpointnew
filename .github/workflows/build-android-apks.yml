name: Build Customer and Admin Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/customer-admin-android-builds-2026-10-20
  pull_request:
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/PublicPortalApp.tsx'
      - 'src/services/nativePushNotifications.ts'
      - 'src/services/auth/accountBiometric.ts'
      - 'src/components/pages/SettingsPage.tsx'
      - 'src/components/pages/PublicCustomerPortalPage.tsx'
      - 'src/components/settings/AdminBiometricSettings.tsx'
      - 'scripts/android/**'
      - 'supabase/functions/account-biometric/**'
      - 'supabase/migrations/*server_verified_biometric*.sql'
      - 'src/tests/native_push_notifications.test.ts'
      - 'supabase/config.toml'
      - 'supabase/functions/native-push/**'
      - 'supabase/migrations/*native_push_notifications.sql'
      - 'capacitor.*.config.json'
      - '.gitignore'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: read

jobs:
  verify-native-notifications:
    name: Verify notification integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      - name: Install dependencies
        run: npm install

      - name: Typecheck application and native notification integration
        run: npm run lint

      - name: Test native notification registration and foreground delivery
        run: npx vitest run src/tests/native_push_notifications.test.ts

      - name: Typecheck native push Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/native-push/index.ts

      - name: Typecheck server-verified biometric Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/account-biometric/index.ts

      - name: Parse migration SQL and assert canonical trigger coverage
        run: |
          python3 -m pip install --disable-pip-version-check pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          migration = Path("supabase/migrations/20261020200000_native_push_notifications.sql").read_text()
          parse_sql(migration)
          biometric_migration = Path("supabase/migrations/20261022100000_server_verified_biometric_credentials.sql").read_text()
          parse_sql(biometric_migration)
          for table in ("account_biometric_credentials", "account_biometric_challenges"):
              if f"REVOKE ALL ON TABLE public.{table} FROM PUBLIC, anon, authenticated" not in biometric_migration:
                  raise SystemExit(f"Biometric table {table} is missing direct-access revocation")
          print("Biometric credential schema parses and blocks direct anon/authenticated access.")
          fixes = sorted(Path("supabase/migrations").glob("*fix_native_push*.sql"))
          if not fixes:
              raise SystemExit("Native push pg_net fix migration is missing")
          for fix in fixes:
              fix_sql = fix.read_text()
              parse_sql(fix_sql)
              if "http_post(" in fix_sql:
                  if "http_post($1, $4, $2, $3, $5)" not in fix_sql:
                      raise SystemExit("pg_net http_post call does not match the installed positional signature")
          final_fix = Path("supabase/migrations/20261021120000_fix_native_push_pg_net_schema_resolution.sql").read_text()
          if "http_post($1, $4, $2, $3, $5)" not in final_fix or "pg_get_function_identity_arguments" not in final_fix:
              raise SystemExit("Final pg_net schema/signature repair is incomplete")
          order_migration = Path("supabase/migrations/20261021100000_fix_native_push_http_post_native_push_notifications.sql").read_text()
          for trigger in ("native_push_order_created", "native_push_order_fully_delivered"):
              if order_migration.count("CREATE TRIGGER " + trigger) != 1:
                  raise SystemExit(f"Expected exactly one order push trigger: {trigger}")
          print("Migration SQL parsed; payment/account/goal/order triggers and idempotency/session guards are present.")
          PY

  full-app-regression-baseline:
    name: Existing full application regression suite
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Keep legacy-suite failures visible without blocking the focused notification
      # checks or APK packaging; do not modify unrelated financial/business tests here.
      - name: Run full application regression suite
        continue-on-error: true
        run: npm test

  build-apk:
    needs: verify-native-notifications
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [customer, admin]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build selected web variant
        env:
          VITE_NATIVE_PUSH_ENABLED: ${{ (matrix.variant == 'customer' && secrets.GOOGLE_SERVICES_JSON_CUSTOMER_BASE64 != '') || (matrix.variant == 'admin' && secrets.GOOGLE_SERVICES_JSON_ADMIN_BASE64 != '') }}
        run: npm run build:${{ matrix.variant }}

      - name: Select Capacitor app configuration
        run: cp capacitor.${{ matrix.variant }}.config.json capacitor.config.json

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Install server-verified Android biometric signing plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("scripts/android/AccountBiometricPlugin.java")
          if not source.is_file():
              raise SystemExit("Server-verified biometric plugin source is missing")
          java_root = Path("android/app/src/main/java")
          java_root.mkdir(parents=True, exist_ok=True)
          package_dir = java_root / "com/chargerpointnew/biometric"
          package_dir.mkdir(parents=True, exist_ok=True)
          (package_dir / "AccountBiometricPlugin.java").write_text(source.read_text())

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "android.permission.USE_BIOMETRIC" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          manifest.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          gradle = app_gradle.read_text()
          if "androidx.biometric:biometric" not in gradle:
              match = re.search(r"dependencies\s*\{", gradle)
              if not match:
                  raise SystemExit("Could not find Android app dependencies block")
              gradle = gradle[:match.end()] + "\n    implementation 'androidx.biometric:biometric:1.1.0'" + gradle[match.end():]
              app_gradle.write_text(gradle)

          activities = list(java_root.rglob("MainActivity.java"))
          if len(activities) != 1:
              raise SystemExit(f"Expected exactly one generated MainActivity.java, found {len(activities)}")
          main = activities[0]
          code = main.read_text()
          if "com.chargerpointnew.biometric.AccountBiometricPlugin" not in code:
              code = code.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.chargerpointnew.biometric.AccountBiometricPlugin;")
          if "registerPlugin(AccountBiometricPlugin.class)" not in code:
              if "void onCreate(" in code:
                  code = re.sub(r"(void onCreate\([^)]*\)\s*\{)", r"\1\n    registerPlugin(AccountBiometricPlugin.class);", code, count=1)
              else:
                  code = re.sub(r"(class MainActivity extends BridgeActivity\s*\{)", r"\1\n  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    registerPlugin(AccountBiometricPlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n", code, count=1)
          main.write_text(code)
          print("Android Keystore + strong-biometric signing plugin registered.")
          PY

      - name: Configure Firebase Cloud Messaging for native push
        env:
          GOOGLE_SERVICES_JSON_CUSTOMER_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER_BASE64 }}
          GOOGLE_SERVICES_JSON_ADMIN_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_ADMIN_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re

          variant = "${{ matrix.variant }}"
          secret_name = "GOOGLE_SERVICES_JSON_CUSTOMER_BASE64" if variant == "customer" else "GOOGLE_SERVICES_JSON_ADMIN_BASE64"
          encoded = os.environ.get(secret_name, "").strip()
          if not encoded:
              print(f"::warning::{secret_name} is not configured; APK builds, but FCM delivery will not work until Firebase configuration is added.")
              raise SystemExit(0)
          expected_package = "com.chargerpointnew." + variant
          try:
              firebase = base64.b64decode(encoded, validate=True)
              parsed = json.loads(firebase)
          except Exception as exc:
              raise SystemExit("Firebase JSON secret is not valid base64-encoded data") from exc
          clients = parsed.get("client", [])
          packages = [item.get("client_info", {}).get("android_client_info", {}).get("package_name") for item in clients]
          if expected_package not in packages:
              raise SystemExit(f"Firebase config does not contain expected Android package {expected_package}")

          Path("android/app/google-services.json").write_bytes(firebase)
          root_gradle = Path("android/build.gradle")
          root = root_gradle.read_text()
          if "com.google.gms:google-services" not in root:
              match = re.search(r"dependencies\s*\{", root)
              if not match:
                  raise SystemExit("Could not locate root Gradle dependencies for Google Services plugin")
              root = root[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root[match.end():]
              root_gradle.write_text(root)
          app_gradle = Path("android/app/build.gradle")
          app = app_gradle.read_text()
          if "com.google.gms.google-services" not in app:
              app_gradle.write_text(app.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          print("Firebase Cloud Messaging configured for " + variant)
          PY

      - name: Declare Android camera permission for QR scanning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("<application", '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          if "android.permission.CAMERA" not in content:
              content, count = re.subn(
                  r"(?m)^([ \t]*)<application\b",
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n'
                  r"\1<application",
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not safely add CAMERA permission to AndroidManifest.xml")
          manifest.write_text(content)

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Apply official mountain-and-moon launcher icon and localized app name
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import cairosvg

          variant = "${{ matrix.variant }}"
          res = Path("android/app/src/main/res")
          full_icon = Path("public/icon.svg")
          foreground_icon = Path("public/charging-point-foreground.svg")
          if not full_icon.is_file() or not foreground_icon.is_file():
              raise SystemExit("Official Charging Point SVG icon assets are missing")

          density_sizes = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }
          for density, (legacy_size, foreground_size) in density_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  cairosvg.svg2png(url=str(full_icon), write_to=str(folder / name),
                                   output_width=legacy_size, output_height=legacy_size)
              cairosvg.svg2png(url=str(foreground_icon),
                               write_to=str(folder / "ic_launcher_foreground.png"),
                               output_width=foreground_size, output_height=foreground_size)

          adaptive_folder = res / "mipmap-anydpi-v26"
          adaptive_folder.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/cp_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (adaptive_folder / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive_folder / "ic_launcher_round.xml").write_text(adaptive_xml)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "cp_icon_colors.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="cp_icon_background">#082b32</color></resources>
          ''')

          # Android's generated activity label may use title_activity_main rather than app_name.
          # Localize both keys so the launcher label follows the device's Android locale.
          base_name = "Charging Point" if variant == "customer" else "Charging Point Admin"
          arabic_name = "نقطة الشحن" if variant == "customer" else "نقطة الشحن - الإدارة"

          def set_string(xml, key, value):
              pattern = rf'<string name="{re.escape(key)}">.*?</string>'
              replacement = f'<string name="{key}">{value}</string>'
              if re.search(pattern, xml):
                  return re.sub(pattern, replacement, xml, count=1)
              return xml.replace("</resources>", f'    {replacement}\n</resources>')

          strings_file = values / "strings.xml"
          strings = strings_file.read_text(encoding="utf-8")
          for key in ("app_name", "title_activity_main"):
              strings = set_string(strings, key, base_name)
          strings_file.write_text(strings, encoding="utf-8")

          for locale, app_name in (("ar", arabic_name), ("en", base_name)):
              folder = res / f"values-{locale}"
              folder.mkdir(parents=True, exist_ok=True)
              localized = folder / "strings.xml"
              if localized.exists():
                  text = localized.read_text(encoding="utf-8")
              else:
                  text = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
              for key in ("app_name", "title_activity_main"):
                  text = set_string(text, key, app_name)
              localized.write_text(text, encoding="utf-8")
          print(f"Applied locale-aware launcher labels for {variant}")
          PY

      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Name APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ChargerPoint-${{ matrix.variant }}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargerPoint-${{ matrix.variant }}-debug-apk
          path: artifacts/ChargerPoint-${{ matrix.variant }}-debug.apk
          if-no-files-found: error
          retention-days: 14
