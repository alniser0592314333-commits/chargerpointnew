name: Build Customer and Admin Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - feature/customer-admin-android-builds-2026-10-20
  pull_request:
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/PublicPortalApp.tsx'
      - 'capacitor.*.config.ts'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [customer, admin]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build selected web variant
        run: npm run build:${{ matrix.variant }}

      - name: Generate native Android project
        run: npx cap add android --config capacitor.${{ matrix.variant }}.config.ts

      - name: Sync Capacitor assets
        run: npx cap sync android --config capacitor.${{ matrix.variant }}.config.ts

      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Name APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ChargerPoint-${{ matrix.variant }}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargerPoint-${{ matrix.variant }}-debug-apk
          path: artifacts/ChargerPoint-${{ matrix.variant }}-debug.apk
          if-no-files-found: error
          retention-days: 14
