name: Server auto-delivery
on:
  schedule:
    # Reconcile every 30 minutes; the server function enforces Palestine local time.
    - cron: "0,30 14-22 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-auto-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run server-side delivery reconciliation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "Missing repository secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          curl --silent --show-error --fail-with-body --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" --data '{}' \
            "${SUPABASE_URL%/}/functions/v1/auto-deliver-pending"
