name: Verify server auto-delivery
on:
  pull_request:
    paths:
      - "supabase/functions/auto-deliver-pending/**"
      - "supabase/migrations/*server_auto_delivery*"
      - ".github/workflows/server-auto-delivery.yml"
  push:
    branches: ["main", "feature/server-auto-delivery-5pm-2026-10-19"]
    paths:
      - "supabase/functions/auto-deliver-pending/**"
      - "supabase/migrations/*server_auto_delivery*"
      - ".github/workflows/server-auto-delivery.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check server function
        run: deno check --node-modules-dir=auto supabase/functions/auto-deliver-pending/index.ts
      - name: Verify guarded service-role path
        shell: bash
        run: |
          set -euo pipefail
          grep -q "request.jwt.claim.role" supabase/migrations/20261019160000_server_auto_delivery_service_role.sql
          grep -q "p_command_type = 'DELIVER_ORDER_ITEM'" supabase/migrations/20261019160000_server_auto_delivery_service_role.sql
          grep -q "autoDelivery" supabase/migrations/20261019160000_server_auto_delivery_service_role.sql
          grep -q "TO service_role" supabase/migrations/20261019160000_server_auto_delivery_service_role.sql
          grep -q "IF v_definition IS NULL OR position(v_old in v_definition) = 0" supabase/migrations/20261019160000_server_auto_delivery_service_role.sql
          grep -q "cron.schedule" supabase/migrations/20261019170000_supabase_native_auto_delivery_schedule.sql
          ! grep -Eq "^[[:space:]]*schedule:" .github/workflows/server-auto-delivery.yml
