name: Verify application
on:
  push:
    branches:
      - fix/daily-order-numbering-and-renumber-workflow
  pull_request:
    branches:
      - main
      - master
      - fix/daily-order-numbering-and-renumber-workflow
      - fix/smart-goal-policy-2026-10
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
