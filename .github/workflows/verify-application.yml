  diagnose-main-test-baseline:
    name: Diagnose full-suite baseline on main
    runs-on: ubuntu-latest
    steps:
      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run main baseline suite without failing the diagnostic job
        env:
          # Keep the baseline run isolated from the real project as well.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee main-baseline-tests.log
          test_status=${PIPESTATUS[0]}
          echo "MAIN_BASELINE_EXIT=${test_status}"
          grep -E 'Test Files|Tests  ' main-baseline-tests.log | tail -n 8 || true
          exit 0

  verify-smart-goal-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';
          CREATE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.role'', true)';
          SQL
      - name: Prepare minimal isolated smart-goal schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/smart_goal_policy_fixture.sql
      - name: Apply the actual smart-goal policy migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009080000_smart_goal_policy.sql
      - name: Execute goal progress, completion, expiry, bonus, and guard regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/smart_goal_policy_runtime.test.sql

      - name: Apply renumbering migration after smart-goal migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009090000_add_atomic_day_order_renumbering.sql
      - name: Revoke direct access to SECURITY DEFINER goal trigger functions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009200000_revoke_goal_trigger_function_execute.sql
      - name: Revoke direct service-role access to the internal goal evaluator
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009201000_revoke_goal_evaluator_service_role_execute.sql
      - name: Verify final combined dispatcher contract and privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $combined_check$
          DECLARE
            dispatcher regprocedure := 'public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure;
            definition text := pg_get_functiondef(dispatcher);
          BEGIN
            IF position('WHEN ''CREATE_GOAL'' THEN' in definition) = 0 THEN
              RAISE EXCEPTION 'Combined dispatcher lost CREATE_GOAL';
            END IF;
            IF position('WHEN ''RENUMBER_DAY_ORDERS'' THEN' in definition) = 0 THEN
              RAISE EXCEPTION 'Combined dispatcher lost RENUMBER_DAY_ORDERS';
            END IF;
            IF position('p_payload->>''adminBin''' in definition) > 0 THEN
              RAISE EXCEPTION 'Combined dispatcher reintroduced legacy adminBin alias';
            END IF;
            IF has_function_privilege('anon', dispatcher, 'EXECUTE')
               OR NOT has_function_privilege('authenticated', dispatcher, 'EXECUTE')
               OR NOT has_function_privilege('service_role', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'Combined dispatcher grants are incorrect';
            END IF;
            IF has_table_privilege('authenticated', 'public.order_renumber_audit', 'SELECT')
               OR has_table_privilege('authenticated', 'public.order_renumber_audit', 'INSERT')
               OR has_table_privilege('anon', 'public.order_renumber_audit', 'SELECT') THEN
              RAISE EXCEPTION 'Renumber audit table must not be directly exposed';
            END IF;
            IF has_function_privilege('anon', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('anon', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE')
               OR has_function_privilege('anon', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Internal/trigger-only goal SECURITY DEFINER functions must not be directly executable';
            END IF;
          END $combined_check$;
          SQL

