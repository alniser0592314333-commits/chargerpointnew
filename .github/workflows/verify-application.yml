name: Verify application
on:
  push:
    branches:
      - fix/isolated-safe-day-renumbering-20261009
      - fix/integrated-goals-and-safe-renumbering-20261009
  pull_request:
    branches:
      - main
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run customer and home financial history grouping regressions
        run: npx vitest run src/tests/customer_financial_history_grouping.test.ts src/tests/home_financial_activity_grouping.test.ts
      - name: Run order-numbering safety tests
        run: npx vitest run src/tests/order_numbering_safety.test.ts && npx vitest run src/tests/order_numbering_diagnostics.test.ts && npx vitest run src/tests/order_numbering_sql_contract.test.ts && npx vitest run src/tests/super_admin_debt_limit_warning_sql_contract.test.ts && npx vitest run src/domain/rules.goal.test.ts && npx vitest run src/tests/canonical_goals_foundation.test.ts && npx vitest run src/tests/phase1_reconciliation_closure.test.ts -t 'Goal Generation Formulas|Goal Request Security & Authorization' && npx vitest run src/tests/goal_restore_normalization.test.ts
      - name: Run order-item cancellation and status regressions
        run: npx vitest run src/tests/order_item_cancel_status_contract.test.ts src/tests/phase6_11_4_delivery_bin_security.test.ts && npx vitest run src/tests/domain.test.ts -t 'Item Removal vs Full Order Cancellation Permission Boundaries'
      - name: Type-check (diagnostic; repository-wide baseline)
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npm run build
      - name: Run full existing test suite (diagnostic)
        run: npm test
        continue-on-error: true

  verify-supabase-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE SCHEMA auth; CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';"
      - name: Apply the renumbering migration to isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009090000_add_atomic_day_order_renumbering.sql
      - name: Apply Super Admin debt-limit override migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261010100000_super_admin_debt_limit_warning_policy.sql
      - name: Verify server-side debt guard remains for non-Super-Admin only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            dispatcher_definition TEXT := pg_get_functiondef('public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure);
          BEGIN
            IF position('IF COALESCE(v_admin_role' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Super Admin debt-limit bypass was not installed in canonical dispatcher';
            END IF;
            IF position('(v_rec_item.debt_limit_minor = 0 AND v_projected_balance < 0)' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Zero-limit debt guard was unexpectedly removed for regular admins';
            END IF;
          END;
          $verify$;
          SQL
      - name: Execute success and stale-conflict renumber scenarios
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_numbering_runtime.test.sql
      - name: Verify dispatcher and audit-table privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            dispatcher regprocedure := 'public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure;
          BEGIN
            IF has_function_privilege('anon', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute the SECURITY DEFINER dispatcher';
            END IF;
            IF NOT has_function_privilege('authenticated', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated must retain the canonical dispatcher contract';
            END IF;
            IF NOT has_function_privilege('service_role', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role must retain the canonical dispatcher contract';
            END IF;
            IF has_table_privilege('authenticated', 'public.order_renumber_audit', 'SELECT')
               OR has_table_privilege('authenticated', 'public.order_renumber_audit', 'INSERT')
               OR has_table_privilege('anon', 'public.order_renumber_audit', 'SELECT') THEN
              RAISE EXCEPTION 'the internal renumber audit table must not be directly exposed';
            END IF;
          END $$;
          SQL

  verify-smart-goal-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';
          CREATE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.role'', true)';
          SQL
      - name: Prepare minimal isolated smart-goal schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/smart_goal_policy_fixture.sql
      - name: Apply the actual smart-goal policy migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009080000_smart_goal_policy.sql
      - name: Execute goal progress, completion, expiry, bonus, and guard regressions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/smart_goal_policy_runtime.test.sql

      - name: Apply renumbering migration after smart-goal migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009090000_add_atomic_day_order_renumbering.sql
      - name: Revoke direct access to SECURITY DEFINER goal trigger functions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009200000_revoke_goal_trigger_function_execute.sql
      - name: Revoke direct service-role access to the internal goal evaluator
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009201000_revoke_goal_evaluator_service_role_execute.sql
      - name: Verify final combined dispatcher contract and privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $combined_check$
          DECLARE
            dispatcher regprocedure := 'public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure;
            definition text := pg_get_functiondef(dispatcher);
          BEGIN
            IF position('WHEN ''CREATE_GOAL'' THEN' in definition) = 0 THEN
              RAISE EXCEPTION 'Combined dispatcher lost CREATE_GOAL';
            END IF;
            IF position('WHEN ''RENUMBER_DAY_ORDERS'' THEN' in definition) = 0 THEN
              RAISE EXCEPTION 'Combined dispatcher lost RENUMBER_DAY_ORDERS';
            END IF;
            IF position('p_payload->>''adminBin''' in definition) > 0 THEN
              RAISE EXCEPTION 'Combined dispatcher reintroduced legacy adminBin alias';
            END IF;
            IF has_function_privilege('anon', dispatcher, 'EXECUTE')
               OR NOT has_function_privilege('authenticated', dispatcher, 'EXECUTE')
               OR NOT has_function_privilege('service_role', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'Combined dispatcher grants are incorrect';
            END IF;
            IF has_table_privilege('authenticated', 'public.order_renumber_audit', 'SELECT')
               OR has_table_privilege('authenticated', 'public.order_renumber_audit', 'INSERT')
               OR has_table_privilege('anon', 'public.order_renumber_audit', 'SELECT') THEN
              RAISE EXCEPTION 'Renumber audit table must not be directly exposed';
            END IF;
            IF has_function_privilege('anon', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.enforce_goal_business_rules()', 'EXECUTE')
               OR has_function_privilege('anon', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.reconcile_active_goal_after_item_change()', 'EXECUTE')
               OR has_function_privilege('service_role', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE')
               OR has_function_privilege('anon', 'public.evaluate_customer_active_goal_internal(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Internal/trigger-only goal SECURITY DEFINER functions must not be directly executable';
            END IF;
          END $combined_check$;
          SQL
