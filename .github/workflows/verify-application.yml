name: Verify application
on:
  push:
    branches:
      - fix/isolated-safe-day-renumbering-20261009
      - fix/integrated-goals-and-safe-renumbering-20261009
      - fix/reliable-incremental-sync
      - security/root-cause-hardening-2026-10-17
  pull_request:
    branches:
      - main
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run offline customer payment BIN authorization regressions
        env:
          # These tests use local repositories and mocked BIN verifiers only.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/offline_payment_bin_enforcement.test.ts src/tests/bin_authorization_queue.test.ts src/tests/payment_bin_sql_contract.test.ts src/tests/fifo_payment_status_allocation.test.ts
      - name: Run admin/customer origin routing regressions
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/services/publicPortalOrigin.test.ts
      - name: Type-check application changes
        run: npx tsc --noEmit
      - name: Run customer and home financial history grouping regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_financial_history_grouping.test.ts src/tests/home_financial_activity_grouping.test.ts src/tests/customer_order_history_effective_overlays.test.ts
      - name: Run customer QR portal security contract tests
        env:
          # Tests inspect source contracts only; never connect to Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_portal_security_contract.test.ts

      - name: Run customer account session recovery regressions
        env:
          # These are pure session-policy tests and never connect to production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_session_recovery.test.ts

      - name: Run notification routing and customer SMS regressions
        env:
          # These are source-contract tests and never connect to production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_notifications_routing.test.ts
      - name: Run balance top-up SMS confirmation regressions
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/balance_topup_sms_confirmation.test.ts
      - name: Run redesigned customer profile contact regressions
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_profile_contact_contract.test.ts
      - name: Run order-numbering safety tests
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/order_numbering_safety.test.ts && npx vitest run src/tests/order_numbering_diagnostics.test.ts && npx vitest run src/tests/order_numbering_sql_contract.test.ts src/tests/order_numbering_contiguous_contract.test.ts && npx vitest run src/tests/super_admin_debt_limit_warning_sql_contract.test.ts && npx vitest run src/domain/rules.goal.test.ts && npx vitest run src/tests/canonical_goals_foundation.test.ts && npx vitest run src/tests/phase1_reconciliation_closure.test.ts -t 'Goal Generation Formulas|Goal Request Security & Authorization' && npx vitest run src/tests/goal_restore_normalization.test.ts
      - name: Run order-item cancellation and status regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/order_item_cancel_status_contract.test.ts src/tests/phase6_11_4_delivery_bin_security.test.ts src/tests/offline_reactivity_and_delivery_targeting_regression.test.ts && npx vitest run src/tests/domain.test.ts -t 'Item Removal vs Full Order Cancellation Permission Boundaries'
      - name: Run manual price for Other order item contract tests
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/manual_price_for_other_order_item.test.ts
      - name: Run canonical sync engine and delta paging regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/chunked_bootstrap_snapshot.test.ts src/tests/bootstrap_partial_delta_replay.test.ts src/tests/sync.test.ts src/tests/delta_pull_batch_size.test.ts src/tests/canonical_architecture_foundation.test.ts src/tests/syncBridge.test.ts src/tests/central_sync_bridge_enforcement.test.ts src/tests/order_item_concurrent_conflict.test.ts src/tests/outbox_dependency_revalidation.test.ts src/tests/phase6_13_remote_sync_hydration.test.ts src/tests/phase_sync_ux_and_background_trigger.test.ts src/tests/command_identity_renovation.test.ts src/tests/fifo_payment_status_allocation.test.ts src/tests/update_device_type_repair.test.ts src/tests/cursor_atomicity.test.ts src/tests/clean_bootstrap_reconciliation.test.ts src/tests/execute_sync_command_wrapper_forensic.test.ts
      - name: Run Purchase Book per-admin isolation contracts
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/purchase_book_local_first_contract.test.ts

      - name: Run fresh-client bootstrap reset-marker regression
        env:
          # Test uses a mocked snapshot and must never target production Supabase.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phaseB5_local_reset_marker.test.ts -t 'Fresh browser with missing version|Browser / App Restart Simulation'
      - name: Run financial integrity and allocation regressions
        env:
          # These tests must use local mocks and never touch production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/phase6_8_financials.test.ts src/tests/fifo_payment_status_allocation.test.ts src/tests/financial_consistency.test.ts
      - name: Run auth-token and outbox-resume regressions
        env:
          # These tests mock all HTTP calls and need a configured client, but must never target production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phase6_15_auth_token_and_outbox_resume.test.ts src/tests/phase6_12_2_super_admin_bootstrap.test.ts

      - name: Run admin session lifecycle and biometric BIN regressions
        env:
          # All auth/RPC calls are mocked. Never target the production Supabase project.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/admin_session_lifecycle_regression.test.ts src/tests/auth_login_regression.test.ts src/tests/auth_single_signin_and_error_taxonomy.test.ts src/tests/final_auth_verification.test.ts

      - name: Run online create-day pipeline regressions
        env:
          # The RPC transport is mocked; never point this integration-style test at production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phase6_16_online_create_day_pipeline.test.ts

      - name: Run public order QR partial payment regressions
        env:
          # All tests are local source/unit contracts; never connect to production.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/public_order_page_redesign.test.ts src/tests/qr_payment_balance_and_receipt_integrity.test.ts
      - name: Run public wallet management security contract tests
        env:
          # These tests inspect source contracts only; never connect to production.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/wallet_management_security_contract.test.ts src/tests/wallet_activation_flow_contract.test.ts
      - name: Run Sarah AI provider settings security contracts
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/sarah_ai_settings_contract.test.ts
      - name: Run Sarah AI chat gateway and account-isolation tests
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run supabase/tests/sarah_ai_chat_contract.test.ts src/tests/sarah_account_operation_scope.test.ts src/tests/sarah_account_switch_isolation_contract.test.ts src/tests/sarah_conversation_persistence_contract.test.ts src/tests/sarah_history_bounds.test.ts src/tests/sarah_input_queue_contract.test.ts src/tests/sarah_input_queue_multitab.test.ts

      - name: Set up Deno for Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Sarah AI chat gateway Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sarah-ai-chat/index.ts
      - name: Type-check public QR payment Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/submit-qr-payment/index.ts
      - name: Test hard QR payment upload body limit
        run: deno test --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/submit-qr-payment/requestBodyLimit_test.ts
      - name: Type-check authorized QR receipt signer Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sign-qr-payment-receipt/index.ts
      - name: Test QR receipt path validation
        run: deno test --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sign-qr-payment-receipt/receiptPathValidation_test.ts
      - name: Type-check username sign-in Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sign-in-by-username/index.ts
      - name: Type-check customer account authentication Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/customer-account/index.ts
      - name: Type-check isolated wallet management Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/wallet-service/index.ts
      - name: Type-check Sarah AI provider settings Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sarah-ai-settings/index.ts
      - name: Test provider-neutral Gemini adapter
        run: deno test --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/_shared/ai/geminiProviderAdapter_test.ts
      - name: Type-check shared business-hours Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/business-hours/index.ts
      - name: Type-check authenticated debt reminder Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/debt-reminders/index.ts
      - name: Type-check customer history access Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/customer-history/index.ts
      - name: Type-check native push Edge Function
        run: deno check --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/native-push/index.ts
      - name: Test username sign-in request validation
        run: deno test --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sign-in-by-username/requestValidation_test.ts
      - name: Test username sign-in request-to-Auth boundary
        run: deno test --no-lock --minimum-dependency-age 60 --node-modules-dir=none supabase/functions/sign-in-by-username/handler_test.ts
      - name: Run customer BIN update and exemption regression tests
        env:
          # The customer update fixtures are isolated and never connect to production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_update_bin_sync.test.ts

      - name: Run add-order customer search regressions
        env:
          # Search normalization is pure and must never connect to production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/add_order_customer_search.test.ts

      - name: Run partial customer sync merge regressions
        env:
          # These pure merge tests must never connect to production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_partial_sync_merge.test.ts
      - name: Run customer pricing authority regressions
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_pricing_authority_contract.test.ts

      - name: Type-check and lint
        run: npm run lint
      - name: Run BIN lockout and proof-gated change client regressions
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/bin_change_proof_client_flow.test.ts src/tests/settings_phase1_refinements.test.ts src/tests/bin_attempt_tracking_authoritative.test.ts src/tests/bin_lock_isolation.test.ts
      - name: Build production bundle
        run: npm run build
      - name: Run full existing test suite (diagnostic)
        env:
          # A fake endpoint enables configured-client tests without contacting production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm test
        continue-on-error: true

  verify-supabase-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject duplicate Supabase migration version prefixes
        shell: bash
        run: |
          versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed 's/_.*//' | sort)"
          duplicates="$(printf '%s\n' "$versions" | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate Supabase migration version prefixes:"
            echo "$duplicates"
            exit 1
          fi
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE SCHEMA auth; CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';"
      - name: Verify authoritative customer charger-fee migration in isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres customer_charger_fee_test
          psql -h localhost -U postgres -d customer_charger_fee_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261116103207_authoritative_charger_fee_from_settings.sql
          psql -h localhost -U postgres -d customer_charger_fee_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_charger_fee_authority.test.sql
      - name: Apply wallet service migrations in an isolated PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres wallet_service_test
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028150000_wallet_management_entitlements.sql
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028160000_wallet_accounts_and_transactions.sql
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028161000_wallet_snapshot_rpc.sql
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028170000_wallet_activation_requests.sql
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028171000_wallet_activation_review_rpc.sql
          psql -h localhost -U postgres -d wallet_service_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $wallet_isolation$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.referential_constraints rc
              JOIN information_schema.table_constraints tc
                ON tc.constraint_catalog = rc.constraint_catalog
               AND tc.constraint_schema = rc.constraint_schema
               AND tc.constraint_name = rc.constraint_name
              WHERE tc.constraint_schema = 'public'
                AND tc.table_name IN ('wallet_service_entitlements', 'wallet_accounts', 'wallet_transactions')
                AND tc.constraint_type = 'FOREIGN KEY'
                AND tc.constraint_name NOT IN ('wallet_tx_source_owner_fk', 'wallet_tx_destination_owner_fk')
            ) THEN
              RAISE EXCEPTION 'Wallet tables must not have foreign keys into admin-owned customer data';
            END IF;
            IF NOT (SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid = 'public.wallet_accounts'::regclass)
               OR NOT (SELECT relrowsecurity AND relforcerowsecurity FROM pg_class WHERE oid = 'public.wallet_transactions'::regclass) THEN
              RAISE EXCEPTION 'Wallet ledger tables must enforce RLS';
            END IF;
            IF has_function_privilege('anon', 'public.wallet_record_transaction(uuid,uuid,text,uuid,uuid,bigint,text,uuid,text,text)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.wallet_record_transaction(uuid,uuid,text,uuid,uuid,bigint,text,uuid,text,text)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Browser roles must not execute wallet transaction RPC directly';
            END IF;
          END
          $wallet_isolation$;
          SQL
      - name: Create isolated database for native push debt-reminder session policy
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres native_push_debt_test
      - name: Prepare native push verifier fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d native_push_debt_test -v ON_ERROR_STOP=1 -f supabase/tests/native_push_debt_reminder_fixture.sql
      - name: Apply native push debt-reminder session policy migration
        env:
          PGPASSWORD: postgres
        run: psql --single-transaction -h localhost -U postgres -d native_push_debt_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261116070000_native_push_debt_reminder_session_bypass.sql
      - name: Enforce admin session expiry for native push
        env:
          PGPASSWORD: postgres
        run: psql --single-transaction -h localhost -U postgres -d native_push_debt_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126210000_native_push_admin_session_expiry_gate.sql
      - name: Verify debt reminders bypass only the expired portal session
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d native_push_debt_test -v ON_ERROR_STOP=1 -f supabase/tests/native_push_debt_reminder_runtime.test.sql

      - name: Create isolated database for account session management
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres account_session_test
      - name: Prepare Supabase Auth session fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/account_session_migration_fixture.sql
      - name: Create isolated database for customer account authentication
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres customer_account_auth_test
      - name: Prepare customer account auth migration fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d customer_account_auth_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_account_auth_migration_fixture.sql
      - name: Apply customer account auth migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d customer_account_auth_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261018060000_customer_account_auth.sql
      - name: Verify customer account ACLs and atomic rate limiting
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d customer_account_auth_test -v ON_ERROR_STOP=1 -f supabase/tests/customer_account_auth_migration_test.sql
      - name: Apply account session management migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261014130000_account_session_management.sql
      - name: Apply administrator idle-expiry policy migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261122120000_admin_session_idle_expiry_policy.sql
      - name: Apply strict account-session registry migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126200000_strict_account_session_registry.sql
      - name: Verify account session isolation and revocation behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/account_session_migration_runtime.test.sql
      - name: Prepare security hardening fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_migration_fixture.sql
      - name: Apply security hardening migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017200000_security_hardening_browser_table_privileges.sql
      - name: Apply all-authenticated-policy and customer QR authorization hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017210000_harden_all_authenticated_policies_and_customer_qr_admin_gate.sql
      - name: Restore verified first-owner bootstrap boundary
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017220000_secure_first_super_admin_bootstrap.sql
      - name: Restrict app identity storage writes to active Super Admin
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017230000_harden_app_identity_storage_policies.sql
      - name: Revoke direct execution of exposed trigger-only functions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017240000_revoke_exposed_trigger_function_execute.sql
      - name: Pin mutable SECURITY DEFINER search paths
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017250000_fix_remaining_security_definer_search_path.sql
      - name: Pin pg_temp last for remaining public-only SECURITY DEFINER paths
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017400000_pin_public_only_definer_search_paths.sql
      - name: Verify no public-only SECURITY DEFINER search paths remain
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/security_definer_search_path_closure.test.sql
      - name: Revoke unnecessary anonymous table and sequence privileges
