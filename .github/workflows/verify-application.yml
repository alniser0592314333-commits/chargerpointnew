name: Verify application
on:
  push:
    branches:
      - fix/daily-order-numbering-and-renumber-workflow
  pull_request:
    branches:
      - main
      - master
      - fix/daily-order-numbering-and-renumber-workflow
      - fix/smart-goal-policy-2026-10
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run order-numbering safety tests
        run: npx vitest run src/tests/order_numbering_safety.test.ts -t 'renumbers a complete day|rejects stale day versions|rejects duplicate target numbers|atomic rollback|overlay sequence resumes' && npx vitest run src/tests/order_numbering_diagnostics.test.ts && npx vitest run src/tests/order_numbering_sql_contract.test.ts
      - name: Type-check (diagnostic; repository-wide baseline)
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npm run build
      - name: Run full existing test suite (diagnostic)
        run: npm test
        continue-on-error: true

  verify-supabase-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase and apply all migrations
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy,mailpit,storage-api,supavisor,postgres-meta
      - name: Verify renumbering migration privileges against PostgreSQL
        run: supabase test db --local supabase/tests/order_numbering_migration.test.sql
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
