        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261127220000_sarah_ai_device_management.sql
      - name: Verify Sarah session-bound reads and atomic order creation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/sarah_ai_admin_read_capabilities.test.sql
      - name: Verify atomic quota enforcement under concurrent requests
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          actor="10000000-0000-4000-8000-000000000001"
          session_id="20000000-0000-4000-8000-000000000001"
          rm -f /tmp/sarah-quota-concurrent-*
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DELETE FROM public.sarah_ai_usage_windows WHERE actor_auth_user_id = '$actor' AND window_seconds = 3600"
          for i in $(seq 1 30); do
            (
              result=$(psql -qAt -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.role','authenticated',false); SELECT set_config('request.jwt.claim.sub','$actor',false); SELECT set_config('request.jwt.claim.session_id','$session_id',false); SELECT set_config('request.jwt.claims',json_build_object('role','authenticated','sub','$actor','session_id','$session_id')::text,false); SELECT public.sarah_ai_consume_my_quota('hour');")
              if echo "$result" | grep -Fq '"allowed": true'; then
                echo allowed > "/tmp/sarah-quota-concurrent-$i"
              else
                echo denied > "/tmp/sarah-quota-concurrent-$i"
              fi
            ) &
          done
          wait
          allowed=$(grep -l -x 'allowed' /tmp/sarah-quota-concurrent-* | wc -l | tr -d ' ')
          denied=$(grep -l -x 'denied' /tmp/sarah-quota-concurrent-* | wc -l | tr -d ' ')
          count=$(psql -qAt -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT request_count FROM public.sarah_ai_usage_windows WHERE actor_auth_user_id = '$actor' AND window_seconds = 3600")
          test "$allowed" -eq 20
          test "$denied" -eq 10
          echo "allowed=$allowed denied=$denied persisted_request_count=$count"
          test "$count" -eq 30
