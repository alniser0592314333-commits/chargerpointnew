name: Verify application
on:
  push:
    branches:
      - fix/isolated-safe-day-renumbering-20261009
      - fix/integrated-goals-and-safe-renumbering-20261009
      - fix/reliable-incremental-sync
      - security/root-cause-hardening-2026-10-17
  pull_request:
    branches:
      - main
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Run customer and home financial history grouping regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/customer_financial_history_grouping.test.ts src/tests/home_financial_activity_grouping.test.ts src/tests/customer_order_history_effective_overlays.test.ts
      - name: Run order-numbering safety tests
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/order_numbering_safety.test.ts && npx vitest run src/tests/order_numbering_diagnostics.test.ts && npx vitest run src/tests/order_numbering_sql_contract.test.ts src/tests/order_numbering_contiguous_contract.test.ts && npx vitest run src/tests/super_admin_debt_limit_warning_sql_contract.test.ts && npx vitest run src/domain/rules.goal.test.ts && npx vitest run src/tests/canonical_goals_foundation.test.ts && npx vitest run src/tests/phase1_reconciliation_closure.test.ts -t 'Goal Generation Formulas|Goal Request Security & Authorization' && npx vitest run src/tests/goal_restore_normalization.test.ts
      - name: Run order-item cancellation and status regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/order_item_cancel_status_contract.test.ts src/tests/phase6_11_4_delivery_bin_security.test.ts src/tests/offline_reactivity_and_delivery_targeting_regression.test.ts && npx vitest run src/tests/domain.test.ts -t 'Item Removal vs Full Order Cancellation Permission Boundaries'
      - name: Run canonical sync engine and delta paging regressions
        env:
          # Test runs must never use the production Supabase project.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/sync.test.ts src/tests/delta_pull_batch_size.test.ts src/tests/canonical_architecture_foundation.test.ts src/tests/syncBridge.test.ts src/tests/central_sync_bridge_enforcement.test.ts src/tests/order_item_concurrent_conflict.test.ts src/tests/outbox_dependency_revalidation.test.ts src/tests/phase6_13_remote_sync_hydration.test.ts src/tests/phase_sync_ux_and_background_trigger.test.ts src/tests/command_identity_renovation.test.ts src/tests/fifo_payment_status_allocation.test.ts src/tests/update_device_type_repair.test.ts src/tests/cursor_atomicity.test.ts src/tests/clean_bootstrap_reconciliation.test.ts src/tests/execute_sync_command_wrapper_forensic.test.ts
      - name: Run fresh-client bootstrap reset-marker regression
        env:
          # Test uses a mocked snapshot and must never target production Supabase.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phaseB5_local_reset_marker.test.ts -t 'Fresh browser with missing version|Browser / App Restart Simulation'
      - name: Run financial integrity and allocation regressions
        env:
          # These tests must use local mocks and never touch production Supabase.
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npx vitest run src/tests/phase6_8_financials.test.ts src/tests/fifo_payment_status_allocation.test.ts src/tests/financial_consistency.test.ts
      - name: Run auth-token and outbox-resume regressions
        env:
          # These tests mock all HTTP calls and need a configured client, but must never target production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phase6_15_auth_token_and_outbox_resume.test.ts src/tests/phase6_12_2_super_admin_bootstrap.test.ts

      - name: Run online create-day pipeline regressions
        env:
          # The RPC transport is mocked; never point this integration-style test at production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npx vitest run src/tests/phase6_16_online_create_day_pipeline.test.ts

      - name: Set up Deno for Edge Function validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check public QR payment Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/submit-qr-payment/index.ts
      - name: Type-check authorized QR receipt signer Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/sign-qr-payment-receipt/index.ts
      - name: Test QR receipt path validation
        run: deno test --no-lock --node-modules-dir=none supabase/functions/sign-qr-payment-receipt/receiptPathValidation_test.ts
      - name: Type-check username sign-in Edge Function
        run: deno check --no-lock --node-modules-dir=none supabase/functions/sign-in-by-username/index.ts
      - name: Test username sign-in request validation
        run: deno test --no-lock --node-modules-dir=none supabase/functions/sign-in-by-username/requestValidation_test.ts
      - name: Test username sign-in request-to-Auth boundary
        run: deno test --no-lock --node-modules-dir=none supabase/functions/sign-in-by-username/handler_test.ts
      - name: Type-check and lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Run full existing test suite (diagnostic)
        env:
          # A fake endpoint enables configured-client tests without contacting production.
          VITE_SUPABASE_URL: https://test.supabase.local
          VITE_SUPABASE_ANON_KEY: test-anon-key
        run: npm test
        continue-on-error: true

  verify-supabase-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE SCHEMA auth; CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';"
      - name: Create isolated database for account session management
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres account_session_test
      - name: Prepare Supabase Auth session fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/account_session_migration_fixture.sql
      - name: Apply account session management migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261014130000_account_session_management.sql
      - name: Verify account session isolation and revocation behavior
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/account_session_migration_runtime.test.sql
      - name: Prepare security hardening fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_migration_fixture.sql
      - name: Apply security hardening migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017200000_security_hardening_browser_table_privileges.sql
      - name: Apply all-authenticated-policy and customer QR authorization hardening
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017210000_harden_all_authenticated_policies_and_customer_qr_admin_gate.sql
      - name: Restore verified first-owner bootstrap boundary
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017220000_secure_first_super_admin_bootstrap.sql
      - name: Restrict app identity storage writes to active Super Admin
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017230000_harden_app_identity_storage_policies.sql
      - name: Revoke direct execution of exposed trigger-only functions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017240000_revoke_exposed_trigger_function_execute.sql
      - name: Pin mutable SECURITY DEFINER search paths
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017250000_fix_remaining_security_definer_search_path.sql
      - name: Revoke unnecessary anonymous table and sequence privileges
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017260000_revoke_anon_public_table_privileges.sql
      - name: Remove private account balances from public QR payment status
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017270000_remove_public_qr_payment_balance_disclosure.sql
      - name: Revoke default browser execution on future functions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017290000_revoke_default_public_function_execute.sql
      - name: Add atomic username sign-in rate limiter
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017300000_username_signin_rate_limit.sql
      - name: Disable public username-to-email lookup after replacement path is available
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017310000_disable_public_username_email_lookup.sql
      - name: Verify admin-bound RLS, anonymous ACL revocation, QR/bootstrap authorization, and logo storage
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d account_session_test -v ON_ERROR_STOP=1 -f supabase/tests/security_hardening_migration_runtime.test.sql
      - name: Create isolated database for comprehensive RPC authorization
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres security_rpc_authorization_test
      - name: Prepare isolated RPC authorization fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/tests/security_rpc_authorization_fixture.sql
      - name: Apply history-aligned security function search-path migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017145728_security_function_search_path_hardening.sql
      - name: Verify history-aligned function search-path and legacy RPC closure
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/tests/security_function_search_path_hardening.test.sql
      - name: Apply comprehensive privileged RPC authorization closure
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017153708_security_rpc_authorization_closure.sql
      - name: Verify privileged RPC authorization and pgcrypto exposure
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/tests/security_rpc_authorization_runtime.test.sql

      - name: Prepare goal, customer QR, and sync permission-guard RPC contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE FUNCTION public.evaluate_customer_active_goal__session_guarded_impl(uuid)
            RETURNS jsonb LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
            AS 'SELECT jsonb_build_object(''ok'', true, ''customer_id'', $1)';
          CREATE FUNCTION public.evaluate_customer_active_goal(uuid)
            RETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp
            AS 'BEGIN PERFORM public.assert_my_account_session_active(); RETURN public.evaluate_customer_active_goal__session_guarded_impl($1); END;';
          CREATE FUNCTION public.adopt_customer_qr_token(uuid, text)
            RETURNS text LANGUAGE sql SECURITY DEFINER SET search_path = public, pg_temp
            AS 'SELECT $2';
          CREATE FUNCTION public.capture_sync_bootstrap_snapshot__session_guarded_impl()
            RETURNS jsonb LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
            AS 'SELECT jsonb_build_object(''schema_version'', 1)';
          CREATE FUNCTION public.capture_sync_bootstrap_snapshot()
            RETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path = public, pg_temp
            AS 'BEGIN PERFORM public.assert_my_account_session_active(); RETURN public.capture_sync_bootstrap_snapshot__session_guarded_impl(); END;';
          CREATE FUNCTION public.pull_canonical_changes__session_guarded_impl(bigint, integer)
            RETURNS jsonb LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public, pg_temp
            AS 'SELECT jsonb_build_object(''changes'', ''[]''::jsonb, ''serverResetGeneration'', 1, ''latestSequence'', $1)';
          CREATE FUNCTION public.pull_canonical_changes(bigint, integer DEFAULT 500)
            RETURNS jsonb LANGUAGE plpgsql STABLE SECURITY DEFINER SET search_path = public, pg_temp
            AS 'BEGIN PERFORM public.assert_my_account_session_active(); RETURN public.pull_canonical_changes__session_guarded_impl($1, $2); END;';
          GRANT EXECUTE ON FUNCTION public.evaluate_customer_active_goal(uuid) TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION public.adopt_customer_qr_token(uuid, text) TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION public.capture_sync_bootstrap_snapshot() TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION public.pull_canonical_changes(bigint, integer) TO authenticated, service_role;
          SQL
      - name: Apply goal, customer QR, and sync permission guards
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261017320000_guard_goal_evaluation_and_customer_qr_adoption.sql
      - name: Verify goal, customer QR, and sync RPC permission boundaries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d security_rpc_authorization_test -v ON_ERROR_STOP=1 -f supabase/tests/goal_qr_rpc_permission_guards.test.sql

      - name: Create isolated database for authoritative snapshot paging
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres authoritative_snapshot_test
      - name: Prepare isolated authoritative snapshot paging fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d authoritative_snapshot_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claim.sub'', true)::uuid';
          CREATE TABLE public.admins (id uuid PRIMARY KEY, auth_user_id uuid NOT NULL, role text NOT NULL, is_active boolean NOT NULL);
          CREATE FUNCTION public.get_effective_permissions(uuid) RETURNS TABLE(permission text) LANGUAGE sql STABLE AS 'SELECT NULL::text WHERE false';
          CREATE TABLE public.change_log (sequence_id bigint PRIMARY KEY, payload text NOT NULL);
          CREATE TABLE public.system_settings (key text PRIMARY KEY, value_number bigint);
          INSERT INTO public.admins VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000001', 'SUPER_ADMIN', true);
          INSERT INTO public.system_settings VALUES ('server_reset_generation', 0);
          INSERT INTO public.change_log(sequence_id, payload) VALUES (1,'a'),(2,'b'),(3,'c'),(4,'d'),(5,'e');
          SQL
      - name: Apply authoritative snapshot paging migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d authoritative_snapshot_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013100000_raise_authoritative_snapshot_timeout.sql
      - name: Verify full change-log paging and checkpoint metadata
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d authoritative_snapshot_test -v ON_ERROR_STOP=1 -f supabase/tests/authoritative_snapshot_timeout_runtime.test.sql
      - name: Create isolated database for UUID delivery migration compatibility
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres uuid_delivery_migration_test
      - name: Prepare UUID delivery migration fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/tests/uuid_delivery_migration_fixture.sql
      - name: Apply UUID delivery fix against the original dispatcher
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261012180000_fix_uuid_min_in_delivery_replay.sql
      - name: Verify UUID delivery fix before dispatcher rename
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/tests/uuid_delivery_migration_assert.sql
      - name: Simulate deployed dispatcher wrapper/implementation split
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/tests/uuid_delivery_migration_simulate_rename.sql
      - name: Re-run pending UUID migration after dispatcher rename
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261012180000_fix_uuid_min_in_delivery_replay.sql
      - name: Verify UUID delivery fix remains intact after dispatcher rename
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d uuid_delivery_migration_test -v ON_ERROR_STOP=1 -f supabase/tests/uuid_delivery_migration_assert.sql
      - name: Create isolated database for change-log commit-order regression
        env:
          PGPASSWORD: postgres
        run: createdb -h localhost -U postgres change_log_order_test
      - name: Prepare change-log commit-order fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d change_log_order_test -v ON_ERROR_STOP=1 -f supabase/tests/change_log_commit_order_fixture.sql
      - name: Apply change-log commit-order migration in isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d change_log_order_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261013110000_serialize_change_log_commit_order.sql
      - name: Verify concurrent change-log commits cannot pass the cursor
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: change_log_order_test
        run: bash supabase/tests/change_log_commit_order_runtime.test.sh
      - name: Apply the renumbering migration to isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261009090000_add_atomic_day_order_renumbering.sql
      - name: Apply Super Admin debt-limit override migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261010100000_super_admin_debt_limit_warning_policy.sql
      - name: Verify server-side debt guard remains for non-Super-Admin only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            dispatcher_definition TEXT := pg_get_functiondef('public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure);
          BEGIN
            IF position('IF COALESCE(v_admin_role' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Super Admin debt-limit bypass was not installed in canonical dispatcher';
            END IF;
            IF position('(v_rec_item.debt_limit_minor = 0 AND v_projected_balance < 0)' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Zero-limit debt guard was unexpectedly removed for regular admins';
            END IF;
          END;
          $verify$;
          SQL
      - name: Execute success and stale-conflict renumber scenarios
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_numbering_runtime.test.sql
      - name: Simulate deployed dispatcher split before later migration replacement
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          ALTER FUNCTION public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)
            RENAME TO execute_canonical_sync_command_unlocked;
          CREATE FUNCTION public.execute_canonical_sync_command(
            p_command_id uuid,
            p_command_type text,
            p_payload jsonb,
            p_payload_hash text DEFAULT 'no_hash'::text,
            p_device_id text DEFAULT 'default_device'::text,
            p_actor_id uuid DEFAULT NULL::uuid
          )
          RETURNS jsonb
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = ''
          AS $function$
          BEGIN
            PERFORM pg_advisory_xact_lock(hashtextextended('chargerpointnew:change_log:commit_order', 0));
            RETURN public.execute_canonical_sync_command_unlocked(
              p_command_id, p_command_type, p_payload, p_payload_hash, p_device_id, p_actor_id
            );
          END;
          $function$;
          REVOKE ALL ON FUNCTION public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid) FROM PUBLIC, anon;
          GRANT EXECUTE ON FUNCTION public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid) TO authenticated, service_role;
          SQL
      - name: Apply restored dispatcher migration after wrapper split
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261014120000_restore_day_order_renumber_dispatch.sql
      - name: Verify final dispatcher retains renumber and debt-limit policies
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            dispatcher_definition TEXT := pg_get_functiondef('public.execute_canonical_sync_command_unlocked(uuid,text,jsonb,text,text,uuid)'::regprocedure);
          BEGIN
            IF position('WHEN ''RENUMBER_DAY_ORDERS'' THEN' IN dispatcher_definition) = 0
               OR position('orders:renumber-day' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Renumber command or its permission mapping is missing after later dispatcher replacement';
            END IF;
            IF position('IF COALESCE(v_admin_role' IN dispatcher_definition) = 0
               OR position('(v_rec_item.debt_limit_minor = 0 AND v_projected_balance < 0)' IN dispatcher_definition) = 0 THEN
              RAISE EXCEPTION 'Super Admin debt-limit policy was lost during dispatcher restoration';
            END IF;
          END;
          $verify$;
          SQL
      - name: Re-run renumber scenarios after dispatcher restoration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_numbering_runtime.test.sql
      - name: Prepare isolated orders table for contiguous-numbering migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.orders (
            id uuid,
            day_id uuid NOT NULL,
            display_number integer NOT NULL
          );
          SQL
      - name: Apply server-authoritative contiguous-numbering migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261016130000_server_authoritative_contiguous_order_numbers.sql
      - name: Remove temporary orders table before the full runtime fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP TABLE public.orders;"
      - name: Verify contiguous numbering against the updated canonical dispatcher
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/order_numbering_contiguous_runtime.test.sql
      - name: Verify dispatcher and audit-table privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            dispatcher regprocedure := 'public.execute_canonical_sync_command(uuid,text,jsonb,text,text,uuid)'::regprocedure;
          BEGIN
            IF has_function_privilege('anon', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute the SECURITY DEFINER dispatcher';
            END IF;
            IF NOT has_function_privilege('authenticated', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated must retain the canonical dispatcher contract';
            END IF;
            IF NOT has_function_privilege('service_role', dispatcher, 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role must retain the canonical dispatcher contract';
            END IF;
            IF has_table_privilege('authenticated', 'public.order_renumber_audit', 'SELECT')
               OR has_table_privilege('authenticated', 'public.order_renumber_audit', 'INSERT')
               OR has_table_privilege('anon', 'public.order_renumber_audit', 'SELECT') THEN
              RAISE EXCEPTION 'the internal renumber audit table must not be directly exposed';
            END IF;
          END $$;
          SQL


      - name: Create isolated database for public QR payment workflow
