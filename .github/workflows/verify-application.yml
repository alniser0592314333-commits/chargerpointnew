                USING 'purchases:manage';
              IF v_permission_exists IS NOT TRUE THEN
                RAISE EXCEPTION 'Purchase Book permission was not registered';
              END IF;
            END IF;
          END;
          $purchase_dispatcher_final$;
          SQL
