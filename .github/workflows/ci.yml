name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  # CI verifies the complete branch state before merge.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
