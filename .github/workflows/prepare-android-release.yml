name: Prepare Signed Android Release APKs

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to build (X.Y.Z, for example 1.0.5)"
        required: true
        default: "1.0.5"
        type: string
      release_target:
        description: "Which APK to release"
        required: true
        default: customer
        type: choice
        options:
          - customer
          - admin
          - both

permissions:
  contents: write

jobs:
  ignore-non-dispatch:
    name: Ignore automatic pushes; releases are manual only
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Explain manual release process
        run: echo "Release APKs are prepared only when the workflow is manually dispatched."

  build-release:
    name: Build signed ${{ matrix.variant }} v${{ inputs.release_version }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release_target == 'both' && '["customer","admin"]' || format('["{0}"]', inputs.release_target)) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Typecheck and run notification/version tests
        run: |
          npm run lint
          npx vitest run src/tests/native_push_notifications.test.ts src/tests/app_release_policy.test.ts src/tests/customer_portal_polish.test.ts src/tests/local_payment_helper_code.test.ts

      - name: Build production web assets
        env:
          VITE_APP_VERSION: ${{ inputs.release_version }}
          VITE_NATIVE_PUSH_ENABLED: "true"
        run: npm run build:${{ matrix.variant }}

      - name: Select app identity and generate Android project
        run: |
          cp capacitor.${{ matrix.variant }}.config.json capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Install server-verified Android biometric signing plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("scripts/android/AccountBiometricPlugin.java")
          if not source.is_file():
              raise SystemExit("Server-verified biometric plugin source is missing")
          java_root = Path("android/app/src/main/java")
          java_root.mkdir(parents=True, exist_ok=True)
          package_dir = java_root / "com/chargerpointnew/biometric"
          package_dir.mkdir(parents=True, exist_ok=True)
          (package_dir / "AccountBiometricPlugin.java").write_text(source.read_text())

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "android.permission.USE_BIOMETRIC" not in text:
              text = text.replace("<application", '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application', 1)
          manifest.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          gradle = app_gradle.read_text()
          if "androidx.biometric:biometric" not in gradle:
              match = re.search(r"dependencies\s*\{", gradle)
              if not match:
                  raise SystemExit("Could not find Android app dependencies block")
              gradle = gradle[:match.end()] + "\n    implementation 'androidx.biometric:biometric:1.1.0'" + gradle[match.end():]
              app_gradle.write_text(gradle)

          activities = list(java_root.rglob("MainActivity.java"))
          if len(activities) != 1:
              raise SystemExit(f"Expected exactly one generated MainActivity.java, found {len(activities)}")
          main = activities[0]
          code = main.read_text()
          if "com.chargerpointnew.biometric.AccountBiometricPlugin" not in code:
              code = code.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.chargerpointnew.biometric.AccountBiometricPlugin;")
          if "registerPlugin(AccountBiometricPlugin.class)" not in code:
              if "void onCreate(" in code:
                  code = re.sub(r"(void onCreate\([^)]*\)\s*\{)", r"\1\n    registerPlugin(AccountBiometricPlugin.class);", code, count=1)
              else:
                  code = re.sub(r"(class MainActivity extends BridgeActivity\s*\{)", r"\1\n  @Override\n  public void onCreate(android.os.Bundle savedInstanceState) {\n    registerPlugin(AccountBiometricPlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n", code, count=1)
          main.write_text(code)
          print("Android Keystore + strong-biometric signing plugin registered.")
          PY

      - name: Install local Jawwal Pay plugin for customer release only (no Accessibility service)
        if: matrix.variant == 'customer'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("scripts/android/LocalPaymentHelperPlugin.java")
          if not source.is_file():
              raise SystemExit("Local payment helper source is missing")
          java_root = Path("android/app/src/main/java")
          package_dir = java_root / "com/chargerpointnew/paymenthelper"
          package_dir.mkdir(parents=True, exist_ok=True)
          (package_dir / "LocalPaymentHelperPlugin.java").write_text(source.read_text())

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest_text = manifest.read_text()
          # Direct USSD calling only: do not declare/register any Accessibility service.
          manifest_text = re.sub(r'\\s*<service\\b(?=[^>]*com\\.chargerpointnew\\.paymenthelper\\.UssdAutomationService)[\\s\\S]*?</service>', '', manifest_text)
          manifest.write_text(manifest_text)

          if "android.permission.CALL_PHONE" not in manifest_text:
              manifest_text = manifest_text.replace("<application", '    <uses-permission android:name="android.permission.CALL_PHONE" />\\n    <application', 1)
              manifest.write_text(manifest_text)

          activities = list(java_root.rglob("MainActivity.java"))
          if len(activities) != 1:
              raise SystemExit(f"Expected exactly one generated MainActivity.java, found {len(activities)}")
          main = activities[0]
          code = main.read_text()
          import_line = "import com.chargerpointnew.paymenthelper.LocalPaymentHelperPlugin;"
          if import_line not in code:
              anchor = "import com.chargerpointnew.biometric.AccountBiometricPlugin;"
              if anchor in code:
                  code = code.replace(anchor, anchor + "\\n" + import_line, 1)
              else:
                  code = code.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\\n" + import_line, 1)
          if "registerPlugin(LocalPaymentHelperPlugin.class)" not in code:
              if "void onCreate(" in code:
                  code = re.sub(r"(void onCreate\\([^)]*\\)\\s*\\{)", r"\\1\\n    registerPlugin(LocalPaymentHelperPlugin.class);", code, count=1)
              else:
                  code = re.sub(r"(class MainActivity extends BridgeActivity\\s*\\{)", r"\\1\\n  @Override\\n  public void onCreate(android.os.Bundle savedInstanceState) {\\n    registerPlugin(LocalPaymentHelperPlugin.class);\\n    super.onCreate(savedInstanceState);\\n  }\\n", code, count=1)
          main.write_text(code)
          print("Installed encrypted local PIN storage and direct USSD calling; Accessibility service excluded.")
          PY

      - name: Set SemVer and Android versionCode
        env:
          APP_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["APP_VERSION"].strip()
          parts = version.split(".")
          if len(parts) != 3 or any(not p.isdigit() or (len(p) > 1 and p.startswith("0")) for p in parts):
              raise SystemExit("Version must use X.Y.Z, for example 1.0.1")
          major, minor, patch = map(int, parts)
          if major > 2147 or minor > 999 or patch > 999:
              raise SystemExit("Version components exceed supported limits")
          version_code = major * 1000000 + minor * 1000 + patch
          if version_code < 1 or version_code > 2100000000:
              raise SystemExit("Version is outside Android versionCode range")
          gradle = Path("android/app/build.gradle")
          lines = gradle.read_text().splitlines()
          code_count = 0
          name_count = 0
          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith("versionCode ") and code_count == 0:
                  lines[index] = indent + "versionCode " + str(version_code)
                  code_count += 1
              elif stripped.startswith("versionName ") and name_count == 0:
                  lines[index] = indent + 'versionName "' + version + '"'
                  name_count += 1
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")
          gradle.write_text("\n".join(lines) + "\n")
          print("Configured " + version + " with Android versionCode " + str(version_code))
          PY

      - name: Configure Firebase Cloud Messaging
        env:
          GOOGLE_SERVICES_JSON_CUSTOMER_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_CUSTOMER_BASE64 }}
          GOOGLE_SERVICES_JSON_ADMIN_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_ADMIN_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from pathlib import Path
          variant = "${{ matrix.variant }}"
          secret_name = "GOOGLE_SERVICES_JSON_CUSTOMER_BASE64" if variant == "customer" else "GOOGLE_SERVICES_JSON_ADMIN_BASE64"
          encoded = os.environ.get(secret_name, "").strip()
          if not encoded:
              raise SystemExit(secret_name + " is required for release builds")
          try:
              firebase = base64.b64decode(encoded, validate=True)
              parsed = json.loads(firebase)
          except Exception as exc:
              raise SystemExit("Firebase JSON secret is not valid base64") from exc
          expected_package = "com.chargerpointnew." + variant
          packages = [x.get("client_info", {}).get("android_client_info", {}).get("package_name") for x in parsed.get("client", [])]
          if expected_package not in packages:
              raise SystemExit("Firebase config does not contain " + expected_package)
          Path("android/app/google-services.json").write_bytes(firebase)
          root_gradle = Path("android/build.gradle")
          root = root_gradle.read_text()
          if "com.google.gms:google-services" not in root:
              match = re.search(r"dependencies\s*\{", root)
              if not match:
                  raise SystemExit("Could not locate root Gradle dependencies")
              root = root[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root[match.end():]
              root_gradle.write_text(root)
          app_gradle = Path("android/app/build.gradle")
          app = app_gradle.read_text()
          if "com.google.gms.google-services" not in app:
              app_gradle.write_text(app.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY

      - name: Declare Android camera and notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          for permission in ('android.permission.POST_NOTIFICATIONS', 'android.permission.CAMERA', 'android.permission.USE_BIOMETRIC'):
              if permission not in content:
                  content = content.replace('<application', '    <uses-permission android:name="' + permission + '" />\n    <application', 1)
          if 'android.hardware.camera.any' not in content:
              content = content.replace('<application', '    <uses-feature android:name="android.hardware.camera.any" android:required="false" />\n    <application', 1)
          manifest.write_text(content)
          PY

      - name: Apply official mountain-and-moon launcher icon and localized app name
        run: |
          python3 -m pip install --break-system-packages --disable-pip-version-check cairosvg
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import cairosvg

          variant = "${{ matrix.variant }}"
          res = Path("android/app/src/main/res")
          full_icon = Path("public/icon.svg")
          foreground_icon = Path("public/charging-point-foreground.svg")
          if not full_icon.is_file() or not foreground_icon.is_file():
              raise SystemExit("Official Charging Point SVG icon assets are missing")

          density_sizes = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }
          for density, (legacy_size, foreground_size) in density_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  cairosvg.svg2png(url=str(full_icon), write_to=str(folder / name),
                                   output_width=legacy_size, output_height=legacy_size)
              cairosvg.svg2png(url=str(foreground_icon),
                               write_to=str(folder / "ic_launcher_foreground.png"),
                               output_width=foreground_size, output_height=foreground_size)

          adaptive_folder = res / "mipmap-anydpi-v26"
          adaptive_folder.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/cp_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (adaptive_folder / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive_folder / "ic_launcher_round.xml").write_text(adaptive_xml)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "cp_icon_colors.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="cp_icon_background">#082b32</color></resources>
          ''')

          # Android may use title_activity_main as the launcher label instead of app_name.
          base_name = "Charging Point" if variant == "customer" else "Charging Point Admin"
          arabic_name = "نقطة الشحن" if variant == "customer" else "نقطة الشحن - الإدارة"

          def set_string(xml, key, value):
              pattern = rf'<string name="{re.escape(key)}">.*?</string>'
              replacement = f'<string name="{key}">{value}</string>'
              if re.search(pattern, xml):
                  return re.sub(pattern, replacement, xml, count=1)
              return xml.replace("</resources>", f'    {replacement}\n</resources>')

          strings_file = values / "strings.xml"
          strings = strings_file.read_text(encoding="utf-8")
          for key in ("app_name", "title_activity_main"):
              strings = set_string(strings, key, base_name)
          strings_file.write_text(strings, encoding="utf-8")

          for locale, app_name in (("ar", arabic_name), ("en", base_name)):
              folder = res / f"values-{locale}"
              folder.mkdir(parents=True, exist_ok=True)
              localized = folder / "strings.xml"
              if localized.exists():
                  text = localized.read_text(encoding="utf-8")
              else:
                  text = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
              for key in ("app_name", "title_activity_main"):
                  text = set_string(text, key, app_name)
              localized.write_text(text, encoding="utf-8")
          print(f"Applied locale-aware launcher labels for {variant}")

          # Keep Android's native launch window on-brand while the WebView and React app start.
          (values / "cp_launch_colors.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="cp_launch_background_color">#082b32</color></resources>
          """)
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          logo_folder = res / "drawable-nodpi"
          logo_folder.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(url=str(full_icon), write_to=str(logo_folder / "cp_launch_logo.png"),
                           output_width=144, output_height=144)
          (drawable / "cp_launch_background.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/cp_launch_background_color" />
              <item>
                  <bitmap android:src="@drawable/cp_launch_logo" android:gravity="center" />
              </item>
          </layer-list>
          """)

          launch_style = re.compile(r'(<style name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)', re.S)
          launch_style_patched = False
          for styles_path in (values / "styles.xml", res / "values-v31" / "styles.xml"):
              if not styles_path.is_file():
                  continue
              style_text = styles_path.read_text(encoding="utf-8")
              def patch_launch(match):
                  body = match.group(2)
                  for item_name, item_value in (
                      ("android:background", "@drawable/cp_launch_background"),
                      ("windowSplashScreenBackground", "@color/cp_launch_background_color"),
                      ("windowSplashScreenAnimatedIcon", "@mipmap/ic_launcher"),
                  ):
                      item = f'<item name="{item_name}">{item_value}</item>'
                      item_pattern = re.compile(r'<item name="' + re.escape(item_name) + r'">.*?</item>', re.S)
                      if item_pattern.search(body):
                          body = item_pattern.sub(item, body, count=1)
                      else:
                          body += "\n        " + item
                  return match.group(1) + body + match.group(3)
              updated, count = launch_style.subn(patch_launch, style_text, count=1)
              if count:
                  styles_path.write_text(updated, encoding="utf-8")
                  launch_style_patched = True

              # The post-splash application window also gets a dark backing color so
              # Android/WebView initialization cannot expose the default white frame.
              main_style = re.compile(r'(<style name="AppTheme\.NoActionBar"[^>]*>)(.*?)(</style>)', re.S)
              def patch_main(match):
                  body = match.group(2)
                  item = '<item name="android:windowBackground">@color/cp_launch_background_color</item>'
                  item_pattern = re.compile(r'<item name="android:windowBackground">.*?</item>', re.S)
                  body = item_pattern.sub(item, body, count=1) if item_pattern.search(body) else body + "\n        " + item
                  return match.group(1) + body + match.group(3)
              main_updated, main_count = main_style.subn(patch_main, styles_path.read_text(encoding="utf-8"), count=1)
              if main_count:
                  styles_path.write_text(main_updated, encoding="utf-8")
          if not launch_style_patched:
              raise SystemExit("Could not locate AppTheme.NoActionBarLaunch to remove the white native startup screen.")
          print("Configured dark branded native launch screen and window background to avoid the white startup flash.")
          PY

      - name: Configure permanent signing key and R8 obfuscation
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get("ANDROID_KEYSTORE_BASE64", "").strip()
          if not encoded:
              raise SystemExit("Missing ANDROID_KEYSTORE_BASE64. Configure the permanent signing key before releasing updates.")
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 must be base64-encoded keystore bytes") from exc
          if len(data) < 1024:
              raise SystemExit("Signing keystore is unexpectedly small")
          Path("android/app/release-keystore.jks").write_bytes(data)
          gradle = Path("android/app/build.gradle")
          gradle.write_text(gradle.read_text() + """
          
          android {
              signingConfigs {
                  release {
                      storeFile file("release-keystore.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }
          }
          """)
          rules = Path("android/app/proguard-rules.pro")
          rules.write_text((rules.read_text() if rules.exists() else "") + """
          -keepattributes RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,AnnotationDefault,Signature,InnerClasses,EnclosingMethod
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keepclassmembers class * { @com.getcapacitor.annotation.PluginMethod <methods>; }
          """)
          PY

      - name: Sync native plugins and build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Stage signed APK for the GitHub Release
        env:
          APP_VERSION: ${{ inputs.release_version }}
          APP_VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/ChargerPoint-${APP_VARIANT}-v${APP_VERSION}.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChargerPoint-${{ matrix.variant }}-v${{ inputs.release_version }}-signed-apk
          path: artifacts/ChargerPoint-${{ matrix.variant }}-v${{ inputs.release_version }}.apk
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    name: Publish APK files to a versioned GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out source for GitHub CLI release metadata
        uses: actions/checkout@v4

      - name: Download both signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: ChargerPoint-*-v${{ inputs.release_version }}-signed-apk
          path: artifacts
          merge-multiple: true

      - name: Create versioned GitHub Release with APK download links
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.release_version }}
        run: |
          RELEASE_TARGET="${{ inputs.release_target }}"
          files=()
          if [[ "$RELEASE_TARGET" == "customer" || "$RELEASE_TARGET" == "both" ]]; then
            customer_apk="artifacts/ChargerPoint-customer-v${APP_VERSION}.apk"
            test -s "$customer_apk"
            files+=("$customer_apk")
          fi
          if [[ "$RELEASE_TARGET" == "admin" || "$RELEASE_TARGET" == "both" ]]; then
            admin_apk="artifacts/ChargerPoint-admin-v${APP_VERSION}.apk"
            test -s "$admin_apk"
            files+=("$admin_apk")
          fi
          test "${#files[@]}" -gt 0
          gh release create "v${APP_VERSION}" "${files[@]}" --title "نقطة الشحن v${APP_VERSION}" --generate-notes
