<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082622"/>
      <stop offset="100%" stop-color="#14423b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer glowing ring -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"/>
  
  <!-- Smartphone / Order Tablet Frame -->
  <rect x="128" y="96" width="256" height="320" rx="36" fill="#041714" stroke="url(#accent)" stroke-width="12"/>
  
  <!-- Top speaker notch -->
  <rect x="216" y="120" width="80" height="8" rx="4" fill="#14423b"/>
  
  <!-- Content cards -->
  <rect x="160" y="152" width="192" height="48" rx="12" fill="url(#accent)"/>
  <rect x="160" y="216" width="192" height="32" rx="8" fill="#0c312b"/>
  <rect x="160" y="260" width="140" height="24" rx="6" fill="#0c312b"/>
  <rect x="160" y="296" width="100" height="24" rx="6" fill="#0c312b"/>
  
  <!-- Success checkmark badge -->
  <circle cx="320" cy="320" r="32" fill="#10b981"/>
  <path d="M308 320l8 8 16-16" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
