<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>نقطة الشحن</title>
    <meta name="description" content="بوابة نقطة الشحن لإدارة الطلبات وخدمات الزبائن." />
    <meta property="og:title" content="نقطة الشحن" />
    <meta property="og:description" content="بوابة نقطة الشحن." />
    <meta name="theme-color" content="#082622" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="نقطة الشحن" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // One origin serves both installable apps. Route identity selects the
      // manifest; no hostname-based redirects are allowed.
      (function() {
        var path = window.location.pathname;
        var isCustomerRoute = path === '/public/about' || path === '/download' || path === '/public/services' ||
          path.indexOf('/public/services/') === 0 || path.indexOf('/c/') === 0 ||
          path.indexOf('/o/') === 0 || path.indexOf('/pay/') === 0 ||
          path.indexOf('/public/order/') === 0 || path.indexOf('/public/qr/customer/') === 0 ||
          path.indexOf('/public/qr/order/') === 0;
        var isAdminRoute = path === '/app' || path.indexOf('/app/') === 0 ||
          path === '/login' || path === '/reset-password';
        if (path === '/') {
          window.history.replaceState({ path: '/public/about' }, '', '/public/about' + window.location.search + window.location.hash);
          path = '/public/about';
          isCustomerRoute = true;
          isAdminRoute = false;
        }
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isAdminRoute && !isCustomerRoute ? '/manifest-admin.webmanifest' : '/manifest.webmanifest';
        document.head.appendChild(manifestLink);
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sys_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var savedLocale = localStorage.getItem('sys_locale') || 'ar';
          document.documentElement.lang = savedLocale;
          document.documentElement.dir = savedLocale === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
