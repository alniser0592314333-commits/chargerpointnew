    <meta charset="UTF-8" />

    <title>منظومة إدارة الطلبات والزبائن - الأساس الهندسي</title>
    <meta name="description" content="منظومة إدارة الطلبات والزبائن - هيكل هندسي احترافي متكامل يدعم العمل دون إنترنت متعدد اللغات." />
    <meta property="og:title" content="منظومة إدارة الطلبات والزبائن" />
    <meta property="og:description" content="هيكل هندسي احترافي متكامل للطلبات والزبائن." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="منظومة إدارة الطلبات" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Keep the two install identities on separate origins. The admin host
      // defaults to /app; customer capability URLs are always served by www.
      (function() {
        var host = window.location.hostname.toLowerCase();
        var isAdminHost = host === 'admin.monther.work';
        var path = window.location.pathname;
        var isCustomerRoute = path === '/public/about' || path === '/download' || path === '/public/services' ||
          path.indexOf('/public/services/') === 0 || path.indexOf('/c/') === 0 ||
          path.indexOf('/o/') === 0 || path.indexOf('/pay/') === 0 ||
          path.indexOf('/public/order/') === 0 || path.indexOf('/public/qr/customer/') === 0 ||
          path.indexOf('/public/qr/order/') === 0;
        if (isAdminHost && path === '/') {
          window.history.replaceState({ path: '/app' }, '', '/app' + window.location.search + window.location.hash);
          path = '/app';
        }
        if (isAdminHost && isCustomerRoute) {
          window.location.replace('https://www.monther.work' + path + window.location.search + window.location.hash);
          return;
        }
        var isAdminRoute = isAdminHost || path === '/app' || path.indexOf('/app/') === 0 ||
          path === '/login' || path === '/reset-password';
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isAdminRoute ? '/manifest-admin.webmanifest' : '/manifest.webmanifest';
        document.head.appendChild(manifestLink);
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sys_theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          var savedLocale = localStorage.getItem('sys_locale') || 'ar';
          document.documentElement.lang = savedLocale;
          document.documentElement.dir = savedLocale === 'en' ? 'ltr' : 'rtl';
        } catch (e) {}
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
